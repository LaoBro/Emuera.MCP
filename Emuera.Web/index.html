<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Emuera Web</title>
    <!-- 空 favicon（data URI）——阻止浏览器自动请求 /favicon.ico。
         Android MAUI 下页面是 https://game.local/wwwroot/，自动 /favicon.ico 请求落到
         game.local 根 → 图片白名单拒（.ico）→ 走真实网络 → ERR_NAME_NOT_RESOLVED。
         data:, 让 Chromium 解析到 icon 后不再发网络请求（Windows WebView2 / Android WebView 同效）。 -->
    <link rel="icon" href="data:," />
    <style>
      /* 重置 body 默认 margin，避免 100vh 布局产生外层滚动条 */
      body { margin: 0; }
      html, body { height: 100%; }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
