[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "eracore-gateway"
version = "0.1.0"
description = "eracore_agent CLI and HTTP client for EraCore"
requires-python = ">=3.10"
readme = "README.md"

[project.optional-dependencies]
watch = ["websockets>=12"]

[project.scripts]
eracore_agent = "eracore_gateway.__main__:main"

[tool.setuptools.packages.find]
include = ["eracore_gateway*"]
