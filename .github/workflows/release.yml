name: release

# 打 v* 形式的 tag 时自动构建 CLI/Server 附件并创建 Release。
# 首次使用：给目录指定 v0.1.0 标签推送即可，产物会自动通过 Actions 上传为草稿。
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch: {}

jobs:
  build-cli:
    name: Build CLI/Server (win-x64)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      # CLI 的 build/VueBuild.targets 在 build 前调用 npm run build 填充 wwwroot
      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: EraCore.Web/package-lock.json

      - name: Restore npm
        working-directory: EraCore.Web
        run: npm ci

      # 框架依赖发布（不 self-contained）：用户安装 .NET 10 运行时即可运行，避免单包体积大。
      # 输出到绝对路径，避免 Cli Directory.Build.props 的 bin-aot/ 重定向干扰
      - name: Publish EraCore.Cli
        run: |
          dotnet publish EraCore.Cli/EraCore.Cli.csproj -c Release -r win-x64 --self-contained false -o "${{ github.workspace }}/publish/win-x64"

      - name: Zip CLI
        run: |
          Compress-Archive -Path "${{ github.workspace }}/publish/win-x64/*" -DestinationPath "${{ github.workspace }}/EraCore.Cli-win-x64.zip"

      - uses: actions/upload-artifact@v7
        with:
          name: EraCore.Cli-win-x64
          path: ${{ github.workspace }}/EraCore.Cli-win-x64.zip

  build-maui-android:
    name: Build MAUI Android APK
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Install Android workload
        run: dotnet workload install android --skip-manifest-update

      # .NET Android 需 JDK 17 + Android SDK；github windows-latest 已内置 SDK，
      # 这里显式装 JDK 保证版本匹配
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: EraCore.Web/package-lock.json

      - name: Restore npm
        working-directory: EraCore.Web
        run: npm ci

      # MauiAsset Include="wwwroot\**\*" 是 load-time glob：全新 checkout 没有 wwwroot/
      # 会收集不到任何前端文件，导致 APK 缺 assets/wwwroot → 页面 ERR_NAME_NOT_RESOLVED。
      # 因此在 publish 前预置 dist-maui → EraCore.Maui/wwwroot，与本地构建路径一致。
      - name: Build Vue frontend (MAUI)
        working-directory: EraCore.Web
        run: npm run build -- --base=./ --outDir=dist-maui

      - name: Stage wwwroot for MAUI
        run: |
          if (Test-Path "EraCore.Maui/wwwroot") { Remove-Item -Recurse -Force "EraCore.Maui/wwwroot" }
          Copy-Item -Recurse -Force "EraCore.Web/dist-maui" "EraCore.Maui/wwwroot"

      # Android Release 必须签名才能出 APK。CI 先用自生成 debug keystore，
      # 可安装调试；正式上架请在仓库 Secrets 配私有 keystore 替换下面参数。
      - name: Generate debug keystore
        run: |
          keytool -genkeypair -v -keystore "${{ github.workspace }}/debug.keystore" -alias eracore -keyalg RSA -keysize 2048 -validity 10000 -storepass android -keypass android -dname "CN=Debug, OU=Debug, O=EraCore, L=City, S=State, C=CN"

      - name: Publish MAUI Android APK
        run: |
          dotnet publish EraCore.Maui/EraCore.Maui.csproj -f net10.0-android -c Release -o "${{ github.workspace }}/maui-android" -p:AndroidKeyStore=true -p:AndroidSigningKeyStore="${{ github.workspace }}/debug.keystore" -p:AndroidSigningKeyAlias=eracore -p:AndroidSigningKeyPass=android -p:AndroidSigningStorePass=android

      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          name: EraCore.Maui-Android
          path: ${{ github.workspace }}/maui-android/*.apk

  release:
    name: Create GitHub Release
    needs: [build-cli, build-maui-android]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v7
        with:
          path: artifacts
          merge-multiple: true

      # 第一个版本先发草稿，你到网页确认 Release Notes 后再手动发布
      - uses: softprops/action-gh-release@v3
        with:
          files: artifacts/*
          generate_release_notes: true
          draft: true
          name: ${{ github.ref_name }}