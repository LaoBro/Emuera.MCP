  <text x="64" y="410" font-family="Consolas, monospace" font-size="26" fill="#c9d1d9">[2] 读取存档</text>
  <text x="64" y="450" font-family="Consolas, monospace" font-size="26" fill="#c9d1d9">[3] 设置</text>
